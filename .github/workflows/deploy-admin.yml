name: Deploy Admin Panel to Digital Ocean

# Trigger on push to main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy Admin
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and push Docker image
      - name: Build and push Admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unihub-admin:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-admin:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/unihub-admin:buildcache,mode=max

      # Step 5: Deploy to Digital Ocean Droplet
      - name: Deploy to Digital Ocean 
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            # Login to Docker Hub
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            # Stop and remove old container
            docker stop unihub-admin || true
            docker rm unihub-admin || true

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/unihub-admin:latest

            # Run new container
            docker run -d \
              --name unihub-admin \
              --network unihub-network \
              --restart unless-stopped \              
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_API_BASE_URL=${{ secrets.API_BASE_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/unihub-admin:latest

            # Clean up old images
            docker image prune -f
